packages:
  - packages/*
  - apps/*
  - apps/fixtures/*
  - "!**/.tmp/**"

allowBuilds:
  "@parcel/watcher": true
  esbuild: true

ignoredBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - better-sqlite3
  - msw
  - prisma

minimumReleaseAgeExclude:
  - srvx@0.12.4
  - h3@2.0.1-rc.26

onlyBuiltDependencies:
  - "@parcel/watcher"
  - cypress
  - esbuild
